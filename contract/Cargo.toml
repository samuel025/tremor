[package]
name = "tremor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tremor: a memecoin whose supply grows to a fixed relief list when a big earthquake is confirmed. Testnet prototype, no value."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
serde_json = "1"
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

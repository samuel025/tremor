# LIVE contract bot, every 20 minutes: reports new real M6+ quakes from USGS, challenges reports USGS does not confirm, votes, finalizes
# events whose window is over, and claims payouts. TESTNET ONLY. The key is a function-call key limited to report_event, challenge, vote,
# finalize and claim_vote on the contract; it holds coins with no value.
# Setup: repo Settings > Secrets and variables > Actions > secret KEEPER_PRIVATE_KEY (the private_key in .state/keeper_key_live.json).
name: keeper
on:
  schedule: [{ cron: "*/20 * * * *" }]
  workflow_dispatch: {}
concurrency: keeper
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
        working-directory: keeper
      - run: node keeper.mjs --net live --watch --days 3
        working-directory: keeper
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}

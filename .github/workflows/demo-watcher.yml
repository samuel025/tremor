# DEMO contract watcher. The demo windows are 20 s and 30 s, far shorter than a scheduler can wake up, so each run stays alive for ~55 minutes
# and polls every 4 seconds; a new run starts every hour and waits for the previous one (no overlap). While it runs, a made-up quake reported on the
# demo is challenged, voted down and finalized within seconds. TESTNET ONLY, coins with no value.
# Setup: secret DEMO_WATCHER_PRIVATE_KEY (the private_key in .state/keeper_key_demo.json).
# Caveats: GitHub may delay or skip scheduled runs, and its terms are meant for project automation; if this is too much, run the same command
# on any always-on machine: `node keeper/keeper.mjs --net demo --watch --no-report --loop 4`.
name: demo-watcher
on:
  schedule: [{ cron: "0 * * * *" }]
  workflow_dispatch: {}
concurrency: { group: demo-watcher, cancel-in-progress: false }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
        working-directory: keeper
      - run: node keeper.mjs --net demo --watch --no-report --loop 4 --for 55
        working-directory: keeper
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.DEMO_WATCHER_PRIVATE_KEY }}
